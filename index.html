<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salsabila Hidayat — Portfolio</title>
<!-- Menggunakan font Google Montserrat dan JetBrains Mono yang tebal & modern sesuai style Rick -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Dark visual theme - Rick Waalders Style */
    --background: #000000;
    --card-bg: #0d0d0f;
    --text-primary: #ffffff;
    --text-secondary: #92929e;
    --accent-red: #ff3b30;
    --accent-yellow: #ffcc00;
    --border-color: #1a1a1f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background: var(--background);
    color: var(--text-primary);
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
    line-height: 1.5;
  }
  
  /* Font Rick Waalders Header Style */
  h1, h2, h3 {
    font-weight: 900;
    letter-spacing: -0.03em;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }

  /* ---------- NAV ---------- */
  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-color);
  }
  .nav-inner{
    max-width:1180px; margin:0 auto; padding:20px 28px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand{
    font-weight:900; font-size:1.15rem; text-decoration:none;
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{
    width:12px; height:12px; background:var(--accent-red); border-radius: 50%;
    display:inline-block;
  }
  nav.links{ display:flex; gap:32px; }
  nav.links a{
    font-family:'JetBrains Mono', monospace; text-transform:uppercase; font-size:0.75rem;
    letter-spacing:0.05em; text-decoration:none; position:relative; padding-bottom:3px;
    color: var(--text-secondary); transition: color .2s ease;
  }
  nav.links a:hover, nav.links a.active{ color: var(--text-primary); }
  
  /* ---------- HERO SECTION (Rick Style with 3D Avatar) ---------- */
  #hero{
    position:relative;
    min-height:100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 100px;
    overflow:hidden;
    background: radial-gradient(circle at 50% 50%, #0d0d11 0%, #000000 100%);
  }
  
  .hero-grid{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size:56px 56px;
    opacity: 0.7;
  }
  
  .hero-inner{ 
    position:relative; z-index:2; text-align: center; width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .hero-kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent-red);
    margin-bottom: 20px;
  }

  h1.hero-title{
    font-size: clamp(2.8rem, 8vw, 5.8rem);
    color: var(--text-primary);
    margin-bottom: 12px;
    line-height: 1.05;
  }
  
  /* Rick's Tag Name style */
  .tag-yellow {
    background: var(--accent-yellow);
    color: #000;
    font-size: clamp(0.6rem, 1.5vw, 0.9rem);
    padding: 4px 10px;
    border-radius: 4px;
    display: inline-block;
    transform: rotate(-3deg) translateY(-20px) translateX(5px);
    font-weight: 800;
    letter-spacing: -0.01em;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.25);
  }

  .hero-desc{ 
    max-width: 650px; 
    font-size: clamp(1rem, 2.2vw, 1.3rem); 
    color: var(--text-secondary); 
    margin-bottom: 40px; 
    line-height: 1.5;
    font-weight: 500;
  }

  /* 3D Scene Wrapper - Meniru pose di Rick Waalders */
  .hero-visual-3d {
    position: relative;
    width: 100%;
    max-width: 750px;
    height: 380px;
    margin-top: -20px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }

  /* Avatar Salsabila Tengah */
  .avatar-container {
    width: 240px;
    height: 240px;
    z-index: 5;
    position: relative;
    animation: floatAvatar 6s ease-in-out infinite;
  }
  .avatar-3d {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0px 10px 30px rgba(0,0,0,0.5));
  }

  /* Objek-objek bergerak (Hover & float) di kiri dan kanan */
  .floating-obj {
    position: absolute;
    z-index: 4;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.4));
  }
  .obj-left-laptop {
    left: 10%; bottom: 15%; width: 140px;
    animation: floatLeftLaptop 8s ease-in-out infinite;
  }
  .obj-left-cam {
    left: 28%; bottom: 50%; width: 60px;
    animation: floatLeftCam 5s ease-in-out infinite 1s;
  }
  .obj-left-ai {
    left: 5%; bottom: 55%; width: 55px;
    animation: floatLeftAi 7s ease-in-out infinite 0.5s;
  }
  .obj-right-cam {
    right: 12%; bottom: 12%; width: 110px;
    animation: floatRightCam 9s ease-in-out infinite;
  }
  .obj-right-gears {
    right: 5%; bottom: 48%; width: 70px;
    animation: floatRightGears 6s ease-in-out infinite 2s;
  }
  .obj-right-chips {
    right: 25%; bottom: 55%; width: 55px;
    animation: floatRightChips 7s ease-in-out infinite 1.5s;
  }

  /* Animasi Bergerak Mengambang Meniru Perputaran Rick */
  @keyframes floatAvatar {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(1.5deg); }
  }
  @keyframes floatLeftLaptop {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    50% { transform: translateY(-16px) rotate(-4deg) scale(1.03); }
  }
  @keyframes floatLeftCam {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(8deg); }
  }
  @keyframes floatLeftAi {
    0%, 100% { transform: translateY(0) rotate(0) scale(1); }
    50% { transform: translateY(-8px) rotate(-10deg) scale(0.95); }
  }
  @keyframes floatRightCam {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    50% { transform: translateY(-14px) rotate(6deg) scale(1.02); }
  }
  @keyframes floatRightGears {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(15deg); }
  }
  @keyframes floatRightChips {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(-8deg); }
  }

  /* Indikator Halaman (Dots Merah/Gelap sebelah kiri) */
  .page-indicator {
    position: absolute;
    left: 40px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 15px;
    z-index: 10;
  }
  .indicator-dot {
    width: 14px;
    height: 4px;
    background: #2a2a35;
    border-radius: 2px;
    transition: all 0.3s ease;
  }
  .indicator-dot.active {
    width: 24px;
    background: var(--accent-red);
  }

  /* Panah Gulir Bulat Bawah */
  .scroll-down {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #111114;
    border: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    text-decoration: none;
    z-index: 10;
    transition: all 0.3s ease;
  }
  .scroll-down:hover {
    color: var(--text-primary);
    border-color: var(--accent-red);
    transform: translateY(3px);
  }

  /* SECTIONS */
  section{ padding:110px 0; border-bottom: 1px solid var(--border-color); position:relative; }
  .section-head{ margin-bottom:56px; max-width:760px; }
  .section-head h2{ font-size:clamp(2rem,5vw,3.2rem); margin-top:14px; }
  
  /* Sisa UI untuk Experience, Lenses dll */
  /* Silakan isi dengan data detail dari code sebelumnya... */
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="#hero" class="brand"><span class="dot"></span>SALSABILA H.</a>
    <nav class="links">
      <a href="#about" class="active">Work</a>
      <a href="#focus">Focus</a>
      <a href="#leadership">Leadership</a>
      <a href="#about">About</a>
    </nav>
  </div>
</header>

<div class="page-indicator">
  <div class="indicator-dot active"></div>
  <div class="indicator-dot"></div>
  <div class="indicator-dot"></div>
  <div class="indicator-dot"></div>
  <div class="indicator-dot"></div>
</div>

<!-- ============ HERO SECTON (Rick's Aesthetic) ============ -->
<section id="hero">
  <div class="hero-grid"></div>
  <div class="wrap hero-inner">
    <div class="hero-kicker">Karawang, West Java, Indonesia — Expected 2027</div>
    <h1 class="hero-title">
      Hi, I'm Salsabila <span class="tag-yellow">Salsa H.</span>
    </h1>
    <p class="hero-desc">
      I train AI models, develop computer vision, and design interfaces for web and mobile.
    </p>

    <!-- Visual 3D Meniru Total Tampilan Rick Waalders -->
    <div class="hero-visual-3d">
      
      <!-- KIRI: Laptop, Camera, AI microchip float -->
      <img src="asset-laptop-ai.png" alt="Laptop AI visual" class="floating-obj obj-left-laptop">
      <img src="asset-camera.png" alt="Mini camera visual" class="floating-obj obj-left-cam">
      <img src="asset-chip-blue.png" alt="Chip logic visual" class="floating-obj obj-left-ai">
      
      <!-- TENGAH: Karakter 3D Keren (Salsabila dengan Kacamata & Hoodie Gelap) -->
      <div class="avatar-container">
        <img src="https://example.com/salsa-3d-avatar-render.png" alt="Salsabila 3D Render" class="avatar-3d">
      </div>
      
      <!-- KANAN: Cyber Vision camera, Gears, dynamic chips -->
      <img src="asset-arm-cam.png" alt="Cyber Camera visual" class="floating-obj obj-right-cam">
      <img src="asset-gears.png" alt="Micro logic visual" class="floating-obj obj-right-gears">
      <img src="asset-neural-chip.png" alt="Neuro sensor visual" class="floating-obj obj-right-chips">
      
    </div>
  </div>
  
  <a href="#about" class="scroll-down">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
  </a>
</section>

</body>
</html>
